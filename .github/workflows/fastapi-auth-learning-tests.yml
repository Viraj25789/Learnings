name: FastAPI Authentication Learning Tests

on:
  push:
    paths:
      - "Fast API/authentication/**"
      - ".github/workflows/fastapi-auth-learning-tests.yml"
  pull_request:
    paths:
      - "Fast API/authentication/**"
      - ".github/workflows/fastapi-auth-learning-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fast API/authentication
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Fast API/authentication/requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          JWT_SECRET_KEY: test-only-jwt-secret-value-with-more-than-32-characters
          AUTH_DATABASE_PATH: /tmp/learn-auth-test.db
        run: python -m unittest discover -s tests -v
