<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1>list</h1>

    <ul><!-- no type here -->
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ul>

    <ol type="i">
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ol>

    <ul><!-- nested -->
        <li>1</li>
            <ol type="i">
                <li>1</li>
                <li>2</li>
            </ol>
        <li>2</li>
        <li>3</li>
    </ul>

    <dl>
        <dt>
            <dd></dd>
        </dt>
    </dl>


    <!-- block and inline elements jova -->
</body>
</html>
